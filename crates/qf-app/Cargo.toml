[package]
name = "qf-app"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Quillforge application — editor controller and CLI"

[lib]
name = "qf_app"
path = "src/lib.rs"

[[bin]]
name = "quillforge"
path = "src/main.rs"

[dependencies]
qf-core = { workspace = true }
qf-blocks = { workspace = true }
qf-kernel = { workspace = true }
qf-storage = { workspace = true }
qf-export = { workspace = true }
qf-input = { workspace = true }
qf-layout = { workspace = true }
qf-sync = { workspace = true }
qf-ai = { workspace = true }
qf-collab = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
qf-theme = { workspace = true }
rustls = { workspace = true }
image = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
